<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083058"/>
      <stop offset="50%" stop-color="#185892"/>
      <stop offset="100%" stop-color="#0D86E2"/>
    </linearGradient>
    <linearGradient id="rightGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D86E2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D86E2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="80" height="80" patternTransform="rotate(115)">
      <rect width="80" height="80" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>
  <!-- Diagonal pinstripe overlay -->
  <rect width="1584" height="396" fill="url(#stripes)"/>
  <!-- Soft glow on top-right -->
  <ellipse cx="1300" cy="100" rx="500" ry="250" fill="url(#rightGlow)"/>

  <!-- Right-side decorative geometric accent (vertical lines + dots) -->
  <g transform="translate(1310, 198)" opacity="0.55">
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#cfe9ff" stroke-width="1"/>
    <line x1="50" y1="-80" x2="50" y2="80" stroke="#cfe9ff" stroke-width="1"/>
    <line x1="100" y1="-50" x2="100" y2="50" stroke="#cfe9ff" stroke-width="1"/>
    <line x1="150" y1="-80" x2="150" y2="80" stroke="#cfe9ff" stroke-width="1"/>
    <line x1="200" y1="-110" x2="200" y2="110" stroke="#cfe9ff" stroke-width="1"/>
    <circle cx="0" cy="0" r="3.5" fill="#cfe9ff"/>
    <circle cx="50" cy="0" r="3.5" fill="#cfe9ff"/>
    <circle cx="100" cy="0" r="3.5" fill="#cfe9ff"/>
    <circle cx="150" cy="0" r="3.5" fill="#cfe9ff"/>
    <circle cx="200" cy="0" r="3.5" fill="#cfe9ff"/>
  </g>

  <!-- Main text block — positioned clear of LinkedIn's profile photo overlay (bottom-left) -->
  <g transform="translate(360, 0)">
    <!-- Eyebrow -->
    <text x="0" y="138" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3.5" fill="#cfe9ff" font-weight="500">
      FOR FOUNDER-LED OR FAMILY-OWNED B2B FIRMS
    </text>
    <!-- Brand mark -->
    <text x="0" y="226" font-family="Italiana, Georgia, serif" font-size="92" fill="#ffffff" letter-spacing="0.5">
      Revved <tspan font-style="italic" fill="#cfe9ff">for</tspan> Growth.
    </text>
    <!-- Tagline -->
    <text x="0" y="278" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#e6f2ff" letter-spacing="0.5">
      From Stalled to Scalable Revenue.
    </text>
    <!-- Supporting line -->
    <text x="0" y="318" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#bcd9f0" letter-spacing="0.3">
      Embedded operator inside the revenue engine.
    </text>
  </g>

  <!-- URL bottom-right -->
  <text x="1520" y="368" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#bcd9f0" text-anchor="end" letter-spacing="1">
    fixyourrevenueengine.com
  </text>

  <!-- Thin accent line bottom -->
  <rect x="0" y="392" width="1584" height="4" fill="#0D86E2"/>
</svg>
